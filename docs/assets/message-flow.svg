<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Local handoff message flow</title>
  <desc id="desc">An agent queues a compact envelope with an id, sender and recipient, summary, short evidence pointers and a chain pass. Immutable envelopes, status files and append-only receipts live under .agent-state/messages. The recipient reads its inbox and records taken, completed or refused. A message flagged as requiring approval cannot be completed until a person approves it. No network, no agent start, no notification.</desc>
  <style>
    .box { fill: #ffffff; stroke: #3b4252; stroke-width: 1.5; rx: 10; }
    .accent { fill: #e8f4f0; stroke: #0f766e; stroke-width: 2; }
    .warn { fill: #fff7ed; stroke: #b45309; stroke-width: 2; }
    .label { font: 600 15px -apple-system, "Segoe UI", sans-serif; fill: #1f2933; }
    .small { font: 13px -apple-system, "Segoe UI", sans-serif; fill: #3b4252; }
    .mono { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #1f2933; }
    .note { font: 12px -apple-system, "Segoe UI", sans-serif; fill: #52606d; }
    .arrow { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#a); }
    .arrow-warn { stroke: #b45309; stroke-width: 2; fill: none; marker-end: url(#aw); }
    .no { font: 13px -apple-system, "Segoe UI", sans-serif; fill: #b91c1c; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#0f766e"/></marker>
    <marker id="aw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#b45309"/></marker>
  </defs>

  <rect x="40" y="120" width="180" height="80" rx="10" class="box"/>
  <text x="130" y="152" text-anchor="middle" class="label">Agent A</text>
  <text x="130" y="174" text-anchor="middle" class="small">has a conclusion</text>

  <rect x="290" y="100" width="270" height="120" rx="10" class="accent"/>
  <text x="425" y="128" text-anchor="middle" class="label">Envelope</text>
  <text x="425" y="150" text-anchor="middle" class="mono">id, from → to, pass</text>
  <text x="425" y="170" text-anchor="middle" class="mono">summary + short evidence</text>
  <text x="425" y="190" text-anchor="middle" class="mono">request_id (safe retry)</text>
  <text x="425" y="210" text-anchor="middle" class="mono">requires_approval yes/no</text>

  <rect x="290" y="270" width="270" height="120" rx="10" class="box"/>
  <text x="425" y="298" text-anchor="middle" class="label">.agent-state/messages/</text>
  <text x="425" y="320" text-anchor="middle" class="mono">envelopes/  (immutable)</text>
  <text x="425" y="340" text-anchor="middle" class="mono">status/     (queued → …)</text>
  <text x="425" y="360" text-anchor="middle" class="mono">receipts/  (append-only)</text>
  <text x="425" y="380" text-anchor="middle" class="mono">approvals/ (person only)</text>

  <rect x="640" y="120" width="180" height="80" rx="10" class="box"/>
  <text x="730" y="152" text-anchor="middle" class="label">Agent B</text>
  <text x="730" y="174" text-anchor="middle" class="small">reads its inbox</text>

  <rect x="640" y="270" width="180" height="120" rx="10" class="warn"/>
  <text x="730" y="298" text-anchor="middle" class="label">Person</text>
  <text x="730" y="320" text-anchor="middle" class="small">approves when flagged</text>
  <text x="730" y="342" text-anchor="middle" class="small">records the name</text>
  <text x="730" y="364" text-anchor="middle" class="small">(no identity check)</text>

  <path class="arrow" d="M220 160 L290 160"/>
  <path class="arrow" d="M425 220 L425 270"/>
  <path class="arrow" d="M560 160 L640 160"/>
  <text x="600" y="150" text-anchor="middle" class="note">inbox read</text>
  <path class="arrow" d="M730 200 L730 270"/>
  <text x="742" y="240" class="note">approve first</text>
  <path class="arrow-warn" d="M640 330 L560 330"/>
  <text x="600" y="320" text-anchor="middle" class="note">approval gate</text>

  <text x="290" y="60" class="no">No network · no agent start · no notification · no automatic dispatch</text>
  <text x="40" y="430" class="note">Ack records taken / completed / refused. A message marked requires_approval cannot be completed before a person approves it.</text>
</svg>
