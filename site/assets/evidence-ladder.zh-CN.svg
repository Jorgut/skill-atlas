<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">本地 Agent 环境扫描的证据等级</title>
  <desc id="desc">扫描只报告文件证据。not-detected 表示没有工具特定的证据。detected 表示存在工具根目录、可执行文件或非共享的 Skill 根目录。configured 表示存在有文档依据的指令条目，或工具已被检测到，且某个有文档依据的 Skill 根目录包含 Skill。运行时加载被刻意排除在断言之外，并在阶梯上方显示为未断言。</desc>
  <style>
    .step1 { fill: #f6f7f9; stroke: #6b7280; stroke-width: 1.5; }
    .step2 { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .step3 { fill: #e8f4f0; stroke: #0f766e; stroke-width: 2; }
    .label { font: 600 16px -apple-system, "Segoe UI", sans-serif; fill: #1f2933; }
    .small { font: 13px -apple-system, "Segoe UI", sans-serif; fill: #3b4252; }
    .mono { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #1f2933; }
    .note { font: 12.5px -apple-system, "Segoe UI", sans-serif; fill: #52606d; }
    .unverified { fill: #fff7ed; stroke: #b45309; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .cross { font: 700 20px -apple-system, "Segoe UI", sans-serif; fill: #b91c1c; }
  </style>

  <rect x="600" y="24" width="320" height="70" rx="10" class="unverified"/>
  <text x="760" y="52" text-anchor="middle" class="label">运行时加载</text>
  <text x="760" y="76" text-anchor="middle" class="small">扫描不作出断言</text>
  <text x="618" y="56" class="cross">✕</text>

  <rect x="80" y="330" width="800" height="76" rx="10" class="step1"/>
  <text x="104" y="360" class="label">未检测（not-detected）</text>
  <text x="104" y="384" class="mono">无工具根目录、无可执行文件、无工具专属 Skill 根目录</text>

  <rect x="180" y="220" width="700" height="76" rx="10" class="step2"/>
  <text x="204" y="250" class="label">已检测（detected）</text>
  <text x="204" y="274" class="mono">存在工具根目录、PATH 中有可执行文件，或存在非共享 Skill 根目录</text>

  <rect x="280" y="110" width="600" height="76" rx="10" class="step3"/>
  <text x="304" y="140" class="label">已配置（configured）</text>
  <text x="304" y="164" class="mono">有文档依据的指令条目，或已检测工具 + 有文档依据的含 Skill 的根目录</text>

  <path d="M460 306 L460 296" stroke="#52606d" stroke-width="2"/>
  <text x="475" y="306" class="note">证据越多，断言越严</text>

  <text x="80" y="432" class="note">~/.agents/skills 等共享根目录会单独报告，绝不算作工具特定证据。</text>
  <text x="80" y="452" class="note">候选路径最多只能到达 detected，永远不能到达 configured。</text>
</svg>
