<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Поток локальных сообщений о передаче работы</title>
  <desc id="desc">Agent ставит в очередь компактный конверт с id, отправителем и получателем, сводкой, краткими указателями на доказательства и номером прохода. Неизменяемые конверты, файлы состояния и квитанции только для добавления находятся в .agent-state/messages. Получатель читает свой inbox и записывает taken, completed или refused. Сообщение с отметкой requires_approval нельзя завершить, пока человек его не одобрит. Нет сети, нет запуска Agent, нет уведомлений.</desc>
  <style>
    .box { fill: #ffffff; stroke: #3b4252; stroke-width: 1.5; rx: 10; }
    .accent { fill: #e8f4f0; stroke: #0f766e; stroke-width: 2; }
    .warn { fill: #fff7ed; stroke: #b45309; stroke-width: 2; }
    .label { font: 600 15px -apple-system, "Segoe UI", sans-serif; fill: #1f2933; }
    .small { font: 13px -apple-system, "Segoe UI", sans-serif; fill: #3b4252; }
    .mono { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #1f2933; }
    .note { font: 12px -apple-system, "Segoe UI", sans-serif; fill: #52606d; }
    .arrow { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#a); }
    .arrow-warn { stroke: #b45309; stroke-width: 2; fill: none; marker-end: url(#aw); }
    .no { font: 13px -apple-system, "Segoe UI", sans-serif; fill: #b91c1c; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#0f766e"/></marker>
    <marker id="aw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#b45309"/></marker>
  </defs>

  <rect x="40" y="120" width="180" height="80" rx="10" class="box"/>
  <text x="130" y="152" text-anchor="middle" class="label">Agent A</text>
  <text x="130" y="174" text-anchor="middle" class="small">есть вывод</text>

  <rect x="290" y="100" width="270" height="120" rx="10" class="accent"/>
  <text x="425" y="128" text-anchor="middle" class="label">Конверт</text>
  <text x="425" y="150" text-anchor="middle" class="mono">id, from → to, pass</text>
  <text x="425" y="170" text-anchor="middle" class="mono">сводка + краткие доказательства</text>
  <text x="425" y="190" text-anchor="middle" class="mono">request_id (безопасный повтор)</text>
  <text x="425" y="210" text-anchor="middle" class="mono">requires_approval да/нет</text>

  <rect x="290" y="270" width="270" height="120" rx="10" class="box"/>
  <text x="425" y="298" text-anchor="middle" class="label">.agent-state/messages/</text>
  <text x="425" y="320" text-anchor="middle" class="mono">envelopes/  (неизменяемые)</text>
  <text x="425" y="340" text-anchor="middle" class="mono">status/     (queued → …)</text>
  <text x="425" y="360" text-anchor="middle" class="mono">receipts/  (только добавление)</text>
  <text x="425" y="380" text-anchor="middle" class="mono">approvals/ (только человек)</text>

  <rect x="640" y="120" width="180" height="80" rx="10" class="box"/>
  <text x="730" y="152" text-anchor="middle" class="label">Agent B</text>
  <text x="730" y="174" text-anchor="middle" class="small">читает свой inbox</text>

  <rect x="640" y="270" width="180" height="120" rx="10" class="warn"/>
  <text x="730" y="298" text-anchor="middle" class="label">Человек</text>
  <text x="730" y="320" text-anchor="middle" class="small">одобряет по флагу</text>
  <text x="730" y="342" text-anchor="middle" class="small">записывает имя</text>
  <text x="730" y="364" text-anchor="middle" class="small">(без проверки личности)</text>

  <path class="arrow" d="M220 160 L290 160"/>
  <path class="arrow" d="M425 220 L425 270"/>
  <path class="arrow" d="M560 160 L640 160"/>
  <text x="600" y="150" text-anchor="middle" class="note">inbox</text>
  <path class="arrow" d="M730 200 L730 270"/>
  <text x="742" y="240" class="note">сначала одобрить</text>
  <path class="arrow-warn" d="M640 330 L560 330"/>
  <text x="600" y="320" text-anchor="middle" class="note">одобрение</text>

  <text x="290" y="60" class="no">Нет сети · нет запуска Agent · нет уведомлений · нет автопередачи</text>
  <text x="40" y="430" class="note">Ack записывает taken / completed / refused. Сообщение с requires_approval нельзя завершить без одобрения человека.</text>
</svg>
